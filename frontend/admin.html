<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>管理后台 - 社交运营系统</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="navbar" id="navbar"></div>
<div class="container">
  <h2 style="margin-bottom:20px;">⚙️ 管理后台</h2>
  <div class="tabs">
    <button class="tab active" data-tab="pending">待审核帖子</button>
    <button class="tab" data-tab="reports">举报管理</button>
  </div>
  <div class="tab-panel active" id="tab-pending">
    <div id="pending-list"></div>
    <div class="load-more" id="load-more-pending"></div>
  </div>
  <div class="tab-panel" id="tab-reports">
    <div id="reports-list"></div>
    <div class="load-more" id="load-more-reports"></div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script>
if(!Utils.isAdmin()){window.location.href='/index.html';}
let pendingPage=1, pendingTotal=0, pendingItems=[];
let reportPage=1, reportTotal=0, reportItems=[];

document.addEventListener('DOMContentLoaded',()=>{
  Utils.renderNavbar('navbar');
  loadPending(true);
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.onclick=function(){
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      this.classList.add('active');
      document.getElementById('tab-'+this.dataset.tab).classList.add('active');
      if(this.dataset.tab==='reports') loadReports(true);
    };
  });
});

// ---- Pending Posts ----
async function loadPending(reset=false){
  if(reset){pendingPage=1;pendingItems=[];}
  try{
    const res=await AdminAPI.getPending(pendingPage,10);
    if(reset)pendingItems=res.data.records;else pendingItems=pendingItems.concat(res.data.records);
    pendingTotal=res.data.total; renderPending(); renderPendingLoadMore(); pendingPage++;
  }catch{}
}
function renderPending(){
  const el=document.getElementById('pending-list');
  if(pendingItems.length===0){el.innerHTML='<div class="empty"><p>✅ 没有待审核的帖子</p></div>';return;}
  el.innerHTML=pendingItems.map(p=>`
    <div class="card">
      <div class="card-header">
        <a href="user-profile.html?id=${p.userId}" style="display:flex;align-items:center;gap:8px;">
          <img src="${Utils.avatarUrl(p.avatarUrl)}" class="card-avatar" onerror="this.style.display='none'" />
          <span class="author">${p.nickname||p.username}</span>
        </a>
        <span style="font-size:12px;color:#aaa;">· ${Utils.timeAgo(p.createTime)} · ${p.categoryName||''}</span>
      </div>
      <div class="card-title">${p.title}</div>
      <p class="card-excerpt">${Utils.excerpt(p.content,200)}</p>
      ${Utils.firstImage(p.imageUrls)?`<img src="${Utils.firstImage(p.imageUrls)}" class="card-image" style="max-height:200px;" />`:''}
      <div style="margin-top:12px;display:flex;gap:10px;align-items:center;">
        <button class="btn btn-success btn-sm approve-btn" data-id="${p.id}">✅ 通过审核</button>
        <button class="btn btn-warning btn-sm feature-btn" data-id="${p.id}" style="background:#e6a23c;color:#fff;">⭐ 设为推荐</button>
        <button class="btn btn-danger btn-sm reject-btn" data-id="${p.id}">❌ 退回</button>
        <a href="post-detail.html?id=${p.id}" class="btn btn-sm btn-outline" style="margin-left:auto;">查看详情</a>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.approve-btn').forEach(b=>b.onclick=async function(){
    await AdminAPI.review(this.dataset.id,'approve'); Utils.toast('已通过审核','success'); loadPending(true);
  });
  el.querySelectorAll('.feature-btn').forEach(b=>b.onclick=async function(){
    try {
      await api.post(`/admin/posts/recommend/${this.dataset.id}`);
      Utils.toast('推荐状态已切换','success'); loadPending(true);
    } catch {}
  });
  el.querySelectorAll('.reject-btn').forEach(b=>b.onclick=function(){
    Utils.showRejectDialog(async(reason)=>{await AdminAPI.review(this.dataset.id,'reject',reason);Utils.toast('已退回','success');loadPending(true);});
  });
}
function renderPendingLoadMore(){
  const el=document.getElementById('load-more-pending');
  if(pendingItems.length<pendingTotal)el.innerHTML=`<button class="btn btn-outline btn-block" onclick="loadPending()">加载更多</button>`;
  else el.innerHTML='';
}

// ---- Reports ----
async function loadReports(reset=false){
  if(reset){reportPage=1;reportItems=[];}
  try{
    const res=await api.get(`/admin/reports/pending?page=${reportPage}&size=10`);
    if(reset)reportItems=res.data.records;else reportItems=reportItems.concat(res.data.records);
    reportTotal=res.data.total; renderReports(); renderReportsLoadMore(); reportPage++;
  }catch{}
}
function renderReports(){
  const el=document.getElementById('reports-list');
  if(reportItems.length===0){el.innerHTML='<div class="empty"><p>✅ 没有待处理的举报</p></div>';return;}
  el.innerHTML=reportItems.map(r=>`
    <div class="card">
      <div class="card-title">📄 ${r.postTitle||'(帖子已删除)'}</div>
      <p><strong>举报人：</strong>${r.reporterName}</p>
      <p><strong>原因：</strong>${r.reason} ${r.description||''}</p>
      <p class="text-muted">${Utils.timeAgo(r.createTime)}</p>
      <div style="margin-top:12px;display:flex;gap:10px;">
        <button class="btn btn-danger btn-sm confirm-btn" data-id="${r.id}">确认违规（删除帖子）</button>
        <button class="btn btn-outline btn-sm dismiss-btn" data-id="${r.id}">驳回举报</button>
      </div>
    </div>
  `).join('');
  el.querySelectorAll('.confirm-btn').forEach(b=>b.onclick=function(){
    Utils.showModal('确认违规','<p>确认后将删除该帖子，此操作不可恢复。确定继续？</p>',async()=>{
      await api.post('/admin/reports/handle',{reportId:this.dataset.id,action:'confirm',handleNote:'管理员确认违规'});
      Utils.toast('已处理','success'); loadReports(true);
    });
  });
  el.querySelectorAll('.dismiss-btn').forEach(b=>b.onclick=function(){
    Utils.showModal('驳回举报','<p>确定驳回此举报？</p>',async()=>{
      await api.post('/admin/reports/handle',{reportId:this.dataset.id,action:'dismiss',handleNote:'举报无效'});
      Utils.toast('已驳回','info'); loadReports(true);
    });
  });
}
function renderReportsLoadMore(){
  const el=document.getElementById('load-more-reports');
  if(reportItems.length<reportTotal)el.innerHTML=`<button class="btn btn-outline btn-block" onclick="loadReports()">加载更多</button>`;
  else el.innerHTML='';
}
</script>
</body>
</html>
