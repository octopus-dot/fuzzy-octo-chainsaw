<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 - 社交运营系统</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="auth-page">
      <div class="auth-card">
        <h2>📝 注册</h2>
        <form id="register-form">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" class="form-input" id="username" placeholder="3-50个字符" required minlength="3" maxlength="50" />
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" class="form-input" id="password" placeholder="至少6个字符" required minlength="6" />
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <input type="password" class="form-input" id="confirm-password" placeholder="再次输入密码" required />
          </div>
          <div class="form-group">
            <label>昵称</label>
            <input type="text" class="form-input" id="nickname" placeholder="显示名称（可选）" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">注册</button>
        </form>
        <p class="auth-link">已有账号？<a href="login.html">立即登录</a></p>
        <p class="auth-link"><a href="index.html">← 返回首页</a></p>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.getElementById('register-form').onsubmit = async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm-password').value;
      const nickname = document.getElementById('nickname').value.trim();

      if (!username || !password) {
        Utils.toast('请填写必填字段', 'error'); return;
      }
      if (password !== confirm) {
        Utils.toast('两次密码输入不一致', 'error'); return;
      }

      try {
        await AuthAPI.register({
          username,
          password,
          nickname: nickname || username
        });
        Utils.toast('注册成功！请登录', 'success');
        setTimeout(() => { window.location.href = '/login.html'; }, 800);
      } catch {}
    };
  </script>
</body>
</html>
